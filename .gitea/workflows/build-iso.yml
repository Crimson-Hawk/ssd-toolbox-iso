name: Build SSD Toolbox ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install prerequisites in Arch container
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git base-devel sudo

      - name: Checkout repository
        run: |
          git clone --depth 1 --branch "${GITHUB_REF_NAME:-master}" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" /tmp/build
          cd /tmp/build
          echo "WORK_DIR=/tmp/build" >> "$GITHUB_ENV"

      - name: Build AUR packages
        run: |
          cd "$WORK_DIR"
          chmod +x build-aur-packages.sh
          bash build-aur-packages.sh

      - name: Build ISO
        run: |
          cd "$WORK_DIR"
          chmod +x build.sh
          bash build.sh /tmp/iso-output

      - name: Upload ISO artifact
        run: |
          pacman -S --noconfirm nodejs npm
          env
      - uses: actions/upload-artifact@v3
        with:
          name: ssd-toolbox-iso
          path: /tmp/iso-output/*.iso
          retention-days: 30
