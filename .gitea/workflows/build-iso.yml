name: Build SSD Toolbox ISO

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a release with the built ISO'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release tag (e.g. v2026.03.22)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build ISO in privileged container
        run: |
          # Use a named container so we can copy files out after the build
          # (volume mounts don't work when the runner itself is containerized)
          CONTAINER_NAME="iso-builder-${{ github.run_id }}"
          docker rm -f "$CONTAINER_NAME" 2>/dev/null || true
          docker create --name "$CONTAINER_NAME" --privileged \
            -v /dev:/dev \
            -v /sys/fs/cgroup:/sys/fs/cgroup:ro \
            archlinux:latest bash -c '
              set -euo pipefail

              # Install prerequisites
              pacman -Syu --noconfirm
              pacman -S --noconfirm git base-devel sudo archiso grub efibootmgr

              # Clone the repo
              git clone --depth 1 --branch "'"${GITHUB_REF_NAME:-master}"'" \
                "'"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"'" /build-dir

              # Setup non-root build user
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
              chown -R builder:builder /build-dir

              # Build AUR packages as non-root user
              sudo -u builder bash -c "cd /build-dir && chmod +x build-aur-packages.sh && ./build-aur-packages.sh"

              # Build ISO as root
              mkdir -p /output
              cd /build-dir
              chmod +x build.sh
              ./build.sh /output
            '
          docker start -a "$CONTAINER_NAME"
          mkdir -p "${{ github.workspace }}/output"
          docker cp "$CONTAINER_NAME":/output/. "${{ github.workspace }}/output/"
          docker rm "$CONTAINER_NAME"

      - name: Verify ISO output
        run: |
          echo "Workspace: ${{ github.workspace }}"
          echo "Contents of output directory:"
          ls -lah "${{ github.workspace }}/output/" || echo "Directory not found"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v3
        with:
          name: ssd-toolbox-iso
          path: output/
          retention-days: 7

      - name: Generate release tag
        id: release_tag
        if: ${{ github.event.inputs.create_release == 'true' }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then
            TAG="v$(date +%Y.%m.%d)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        if: ${{ github.event.inputs.create_release == 'true' }}
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          ISO_FILE=$(ls output/*.iso)
          ISO_NAME=$(basename "$ISO_FILE")
          SHA256=$(sha256sum "$ISO_FILE" | cut -d' ' -f1)

          RELEASE_BODY="## SSD Toolbox ${TAG}

          ### Downloads
          - \`${ISO_NAME}\`
          - SHA256: \`${SHA256}\`

          ### Boot modes
          - UEFI (GRUB)
          - BIOS (syslinux)"

          # Create draft release via Gitea API
          RELEASE_ID=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg tag "$TAG" \
              --arg name "SSD Toolbox $TAG" \
              --arg body "$RELEASE_BODY" \
              '{tag_name: $tag, name: $name, body: $body, draft: true, prerelease: false}')" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            | jq -r '.id')

          echo "Created draft release with ID: $RELEASE_ID"

          # Upload the ISO as a release asset
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -F "attachment=@$ISO_FILE" \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets"

          echo "Draft release created: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"