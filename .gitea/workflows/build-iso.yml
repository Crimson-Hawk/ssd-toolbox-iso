name: Build SSD Toolbox ISO

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install prerequisites in Arch container
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm git base-devel sudo

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build AUR packages
        run: |
          chmod +x build-aur-packages.sh
          bash build-aur-packages.sh

      - name: Build ISO
        run: |
          chmod +x build.sh
          bash build.sh /tmp/iso-output

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v3
        with:
          name: ssd-toolbox-iso
          path: /tmp/iso-output/*.iso
          retention-days: 30
